name: Oracle Auto Provision Zoya
on:
  schedule:
    - cron: '0 */6 * * *' # हर 6 घंटे में नया लूप शुरू करेगा
  workflow_dispatch: # मैनुअल स्टार्ट बटन

jobs:
  create-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup OCI CLI
        uses: oracle-actions/setup-oci-cli@v1.1.1
        with:
          tenancy: ${{ secrets.OCI_TENANCY }}
          user: ${{ secrets.OCI_USER }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private_key: ${{ secrets.OCI_API_KEY }}
          region: ${{ secrets.OCI_REGION }}

      - name: Run Python Script (Hit every 30 seconds)
        env:
          STACK_OCID: ${{ secrets.STACK_OCID }}
        run: python main.py
