name: Oracle Auto Provision Zoya (Pro)
on:
  schedule:
    - cron: '0 */5 * * *' # हर 5 घंटे में नया लूप
  workflow_dispatch:

jobs:
  create-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install OCI SDK and Configure
        run: |
          # असली OCI Python लाइब्रेरी इंस्टॉल करना
          pip install oci
          
          # OCI Config सेट करना
          mkdir -p ~/.oci
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          
          # Private Key बनाना
          echo "${{ secrets.OCI_API_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Run Zoya Python Script
        run: python zoya.py
        
