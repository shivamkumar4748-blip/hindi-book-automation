name: Oracle Auto Provision Zoya (Aggressive)
on:
  schedule:
    - cron: '0 */5 * * *' # हर 5 घंटे में नया लूप शुरू करेगा (GitHub लिमिट से बचने के लिए)
  workflow_dispatch: # मैनुअल स्टार्ट बटन

jobs:
  create-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup OCI CLI
        uses: oracle-actions/setup-oci-cli@v1.1.1
        with:
          tenancy: ${{ secrets.OCI_TENANCY }}
          user: ${{ secrets.OCI_USER }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private_key: ${{ secrets.OCI_API_KEY }}
          region: ${{ secrets.OCI_REGION }}

      - name: Hit Oracle API Every 30 Seconds
        run: |
          echo "Starting aggressive 30-second loop..."
          # यह लूप लगातार चलता रहेगा
          while true; do
            echo "Requesting Oracle to create Zoya Server..."
            oci resource-manager job create-apply-job \
            --stack-id ${{ secrets.STACK_OCID }} \
            --execution-plan-strategy AUTO_APPROVED || true
            
            echo "Sleeping for 30 seconds..."
            sleep 30
          done
          
