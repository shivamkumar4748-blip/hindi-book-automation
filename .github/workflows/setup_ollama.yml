name: Founder's Override - Build Key, Lock & Install Zoya

on:
  workflow_dispatch:

jobs:
  creator-mode:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Setup Main Gate (Using Founder's Details)
        run: |
          pip install oci-cli
          mkdir -p ~/.oci
          
          # Writing config securely using exact details
          cat << 'EOF' > ~/.oci/config
          [DEFAULT]
          user=ocid1.user.oc1..aaaaaaaavhodc4ll4cbn465epajsnlhrqlgnl5bnzek2p3ruotuuqfqsk2qq
          fingerprint=1b:50:d2:34:b2:c1:05:05:6c:47:4f:3a:6d:6b:55
          tenancy=ocid1.tenancy.oc1..aaaaaaaajpyefe3wwguem5ljpebb66erskktiltomv4optapcgilwtn6opa
          region=ap-mumbai-1
          key_file=/home/runner/.oci/api_key.pem
          EOF
          chmod 600 ~/.oci/config
          
          # Writing API Key securely from your existing secret
          cat << 'EOF' > ~/.oci/api_key.pem
          ${{ secrets.OCI_API_KEY }}
          EOF
          chmod 600 ~/.oci/api_key.pem

      - name: 2. Forge the New Key & Lock (Creator's Will)
        run: |
          ssh-keygen -t rsa -b 4096 -f zoya_key -N ""
          
          echo "=========================================================="
          echo "🚨 FOUNDER'S NEW ROOM KEY (PRIVATE KEY) 🚨"
          echo "COPY EVERYTHING BELOW THIS LINE TO SAVE IT IN YOUR PHONE:"
          echo "=========================================================="
          cat zoya_key
          echo "=========================================================="
          echo "=== END OF PRIVATE KEY ==="

      - name: 3. Smash & Replace the Old Lock via Main Gate
        run: |
          export PATH=$PATH:/home/runner/bin
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          COMPARTMENT="ocid1.tenancy.oc1..aaaaaaaajpyefe3wwguem5ljpebb66erskktiltomv4optapcgilwtn6opa"
          
          echo "Finding the server..."
          INSTANCE_OCID=$(oci compute instance list -c $COMPARTMENT --all --query "data[0].id" --raw-output || echo "")
          
          if [ -z "$INSTANCE_OCID" ] || [ "$INSTANCE_OCID" == "null" ]; then
            echo "❌ Failed to find the server!"
            exit 1
          fi
          
          PUB_KEY=$(cat zoya_key.pub)
          echo "Injecting new lock..."
          oci compute instance update --instance-id $INSTANCE_OCID --metadata "{\"ssh_authorized_keys\": \"$PUB_KEY\"}" --force
          
          echo "✅ New lock installed! Waiting 60 seconds for it to fully sync..."
          sleep 60

      - name: 4. Enter Room & Install Zoya's Brain (Qwen 32B)
        run: |
          chmod 600 zoya_key
          echo "Opening the door with the new key..."
          
          ssh -o StrictHostKeyChecking=no -i zoya_key ubuntu@${{ secrets.OCI_HOST }} << 'SSH_EOF'
            echo "=== 🚀 INSIDE THE ROOM DIRECTLY ==="
            sudo apt-get update -y
            
            echo "=== Installing Ollama ==="
            curl -fsSL https://ollama.com/install.sh | sh
            
            echo "=== Applying 21GB Crash Prevention Limit ==="
            sudo mkdir -p /etc/systemd/system/ollama.service.d
            cat << 'INNER_EOF' | sudo tee /etc/systemd/system/ollama.service.d/memory-limit.conf
            [Service]
            MemoryMax=21G
            INNER_EOF
            
            sudo systemctl daemon-reload
            sudo systemctl enable ollama
            sudo systemctl restart ollama
            
            echo "=== Installing Zoya's Brain (Qwen 2.5 32B) ==="
            echo "This will take a few minutes..."
            ollama pull qwen2.5:32b
            
            echo "=== 🏆 ZOYA IS ALIVE AND SECURED! ==="
          SSH_EOF
