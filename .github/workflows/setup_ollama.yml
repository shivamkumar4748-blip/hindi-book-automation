name: Phase 2 - Install Ollama & Qwen 32B

on:
  workflow_dispatch:

jobs:
  deploy-zoya:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Server and Install Ollama
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "=== 1. System Update ==="
            sudo apt-get update -y
            
            echo "=== 2. Installing Ollama ==="
            curl -fsSL https://ollama.com/install.sh | sh
            
            echo "=== 3. Starting Ollama Service ==="
            sudo systemctl enable ollama
            sudo systemctl start ollama
            
            echo "=== 4. Pulling Qwen-2.5-32B Model ==="
            echo "Note: This is a ~19GB model. OCI internet is extremely fast, but it will still take a few minutes."
            ollama pull qwen2.5:32b
            
            echo "=== SUCCESS: Zoya's Brain is Installed! ==="
