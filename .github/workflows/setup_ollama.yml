name: Setup Zoya Server

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Detect Door and Install Ollama
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat << 'EOF' > install.sh
          echo "Setting up 32GB Swap Memory..."
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 32G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          fi
          
          echo "Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl enable ollama
          sudo systemctl start ollama
          
          echo "Pulling Qwen-2.5-32B model in background..."
          sudo apt-get install tmux -y
          tmux new-session -d -s pull_model 'ollama run qwen2.5:32b'
          echo "Installation Success!"
          EOF
          
          echo "Testing door 1: ubuntu..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${{ secrets.OCI_HOST }} 'bash -s' < install.sh && exit 0
          
          echo "Testing door 2: opc..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no opc@${{ secrets.OCI_HOST }} 'bash -s' < install.sh && exit 0
          
          echo "Testing door 3: root..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@${{ secrets.OCI_HOST }} 'bash -s' < install.sh && exit 0
          
          echo "Failed. Key is correct, but server is completely rejecting all default usernames."
          exit 1
