          [DEFAULT]
          user=ocid1.user.oc1..aaaaaaaavhodc4li4cbn465epajsmlhrqlgnl5bhzek2p3ruotuuqfqsk2qq
          fingerprint=1b:50:d2:34:b2:c1:05:05:6c:47:4f:3a:66:e6:bd:55
          tenancy=ocid1.tenancy.oc1..aaaaaaaajpyefe3wmwguew5lipebb66etskt4tilonv4opiapcg6lwtn6opa
          region=ap-mumbai-1
          key_file=/home/runner/.oci/api_key.pem
