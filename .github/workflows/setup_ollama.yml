name: Setup Zoya Server & Generate Key

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Key, Inject into Server, and Install Ollama
        run: |
          echo "=== 1. GENERATING FRESH SSH KEY INSIDE GITHUB ==="
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/zoya_auto_key -N ""
          
          # यह रही वो चाबी जो तू मांग रहा था! यह गिटहब के लॉग्स में दिखेगी।
          echo "=== COPY THE PRIVATE KEY BELOW THIS LINE ==="
          cat ~/.ssh/zoya_auto_key
          echo "=== COPY UNTIL HERE ==="
          
          # पब्लिंक की को सर्वर में भेजने की तैयारी
          PUB_KEY=$(cat ~/.ssh/zoya_auto_key.pub)
          
          # ओरेकल एपीआई या ओसीआई सीक्रेट्स का इस्तेमाल करके सर्वर में चाबी इंजेक्ट करना
          # चूंकि हमारे पास OCI API Key (जो तूने पहले दी थी) है, हम ओरेकल से डायरेक्ट कहेंगे कि भाई ये नई की जोड़ ले!
          echo "Injecting public key via OCI CLI..."
          pip install oci-cli
          
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "region=ap-mumbai-1" >> ~/.oci/config
          echo "key_content=${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/config_key.pem
          # (नोट: OCI CLI के जरिए हम सीधे सर्वर के metadata में नई SSH key अपडेट कर सकते हैं)
          
