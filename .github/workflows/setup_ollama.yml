          chmod 600 ~/.oci/config

      - name: 2. Forge New Room Key & Lock
        run: |
          ssh-keygen -t rsa -b 4096 -f zoya_key -N ""
          echo "================================================="
          echo "🚨 SAVE THIS PRIVATE KEY IN YOUR PHONE NOTES 🚨"
          echo "================================================="
          cat zoya_key
          echo "================================================="
          PUB_KEY=$(cat zoya_key.pub)
          echo "NEW_LOCK<<EOF" >> $GITHUB_ENV
          echo "$PUB_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 3. Smash Old Lock & Inject New One
        run: |
          export PATH=$PATH:/home/runner/bin
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          COMPARTMENT="ocid1.tenancy.oc1..aaaaaaaajpyefe3wmwguew5lipebb66etskt4tilonv4opiapcg6lwtn6opa"
          
          echo "Finding the server..."
          INSTANCE_OCID=$(oci compute instance list -c $COMPARTMENT --all --query "data[0].id" --raw-output)
          
          if [ -z "$INSTANCE_OCID" ]; then
            echo "❌ Failed to find the server."
            exit 1
          fi
          
          echo "Server found: $INSTANCE_OCID"
          echo "Installing new lock..."
          oci compute instance update --instance-id $INSTANCE_OCID --metadata "{\"ssh_authorized_keys\": \"${{ env.NEW_LOCK }}\"}" --force
          echo "✅ New lock installed! Waiting 60 seconds for sync..."
          sleep 60

      - name: 4. Enter Room & Install Zoya
        run: |
          chmod 600 zoya_key
          ssh -o StrictHostKeyChecking=no -i zoya_key ubuntu@${{ secrets.OCI_HOST }} << 'SSH_EOF'
            echo "=== Inside Server ==="
            sudo apt-get update -y
            curl -fsSL https://ollama.com/install.sh | sh
            
            sudo mkdir -p /etc/systemd/system/ollama.service.d
            cat << 'INNER_EOF' | sudo tee /etc/systemd/system/ollama.service.d/memory-limit.conf
            [Service]
            MemoryMax=21G
            INNER_EOF
            
            sudo systemctl daemon-reload
            sudo systemctl enable ollama
            sudo systemctl restart ollama
            
            echo "Pulling Qwen-2.5-32B Model..."
            ollama pull qwen2.5:32b
            echo "✅ ZOYA IS ONLINE."
          SSH_EOF
          
