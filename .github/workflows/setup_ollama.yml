name: The Final Protocol - Zoya's Awakening

on:
  workflow_dispatch:

jobs:
  deploy-zoya:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Set up Main Gate (OCI Auth)
        run: |
          pip install oci-cli
          mkdir -p ~/.oci
          
          # Using your exact accurate secrets
          cat << 'EOF' > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=ap-mumbai-1
          key_file=/home/runner/.oci/api_key.pem
          EOF
          chmod 600 ~/.oci/config
          
          cat << 'EOF' > ~/.oci/api_key.pem
          ${{ secrets.OCI_API_KEY }}
          EOF
          chmod 600 ~/.oci/api_key.pem

      - name: 2. Forge New Room Key & Lock (SSH Keypair)
        run: |
          # Creating a brand new, secure 4096-bit lock and key
          ssh-keygen -t rsa -b 4096 -f zoya_ssh_key -N ""
          
          echo "===================================================================="
          echo "🚨🚨🚨 FOUNDER'S NEW ROOM KEY (PRIVATE KEY) 🚨🚨🚨"
          echo "COPY EVERYTHING BELOW THIS LINE TO SAVE IT SECURELY IN YOUR PHONE:"
          echo "===================================================================="
          cat zoya_ssh_key
          echo "===================================================================="
          echo "=== END OF PRIVATE KEY ==="
          
          # Save Public Key (The Lock) to environment for the next step
          PUB_KEY=$(cat zoya_ssh_key.pub)
          echo "NEW_LOCK<<EOF" >> $GITHUB_ENV
          echo "$PUB_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 3. Install New Lock on the Door
        run: |
          export PATH=$PATH:/home/runner/bin
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          COMPARTMENT="${{ secrets.OCI_TENANCY_OCID }}"
          
          echo "Locating the server..."
          INSTANCE_OCID=$(oci compute instance list -c $COMPARTMENT --all --query "data[0].id" --raw-output || echo "")
          
          if [ -z "$INSTANCE_OCID" ] || [ "$INSTANCE_OCID" == "null" ]; then
            echo "❌ Error: Could not find the server. Check if OCI details match."
            exit 1
          fi
          
          echo "Server Found. Breaking old lock and installing the new one..."
          oci compute instance update --instance-id $INSTANCE_OCID --metadata "{\"ssh_authorized_keys\": \"${{ env.NEW_LOCK }}\"}" --force
          
          echo "✅ New lock installed successfully! Waiting 60 seconds for Oracle to register it..."
          sleep 60

      - name: 4. Enter Room & Install Zoya's Brain (Qwen 32B)
        run: |
          chmod 600 zoya_ssh_key
          echo "Opening door with the new key..."
          
          # Using the new key to enter directly
          ssh -o StrictHostKeyChecking=no -i zoya_ssh_key ubuntu@${{ secrets.OCI_HOST }} << 'SSH_EOF'
            echo "=== 🚀 INSIDE THE ROOM DIRECTLY ==="
            sudo apt-get update -y
            
            echo "=== Installing Ollama ==="
            curl -fsSL https://ollama.com/install.sh | sh
            
            echo "=== Setting Crash Prevention Limit (21GB) ==="
            sudo mkdir -p /etc/systemd/system/ollama.service.d
            cat << 'INNER_EOF' | sudo tee /etc/systemd/system/ollama.service.d/memory-limit.conf
            [Service]
            MemoryMax=21G
            INNER_EOF
            
            sudo systemctl daemon-reload
            sudo systemctl enable ollama
            sudo systemctl restart ollama
            
            echo "=== Downloading and Compressing Qwen 2.5 32B Model ==="
            echo "This is a heavy process, it will take some time..."
            ollama pull qwen2.5:32b
            
            echo "=== 🏆 SUCCESS: ZOYA'S BRAIN IS FULLY INSTALLED AND PROTECTED! ==="
          SSH_EOF
