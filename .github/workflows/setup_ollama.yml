      - name: 2. Forge New Room Key & Lock
        run: |
          ssh-keygen -t rsa -b 4096 -f zoya_key -N ""
          echo "================================================="
          echo "🚨 SAVE THIS PRIVATE KEY IN YOUR PHONE NOTES 🚨"
          echo "================================================="
          cat zoya_key
          echo "================================================="
          PUB_KEY=$(cat zoya_key.pub)
          echo "NEW_LOCK<<EOF" >> $GITHUB_ENV
          echo "$PUB_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 3. Smash Old Lock & Inject New One via Python
        env:
          NEW_LOCK: ${{ env.NEW_LOCK }}
        run: |
          python3 - << 'PY_EOF'
          import oci
          import os

          config = oci.config.from_file()
          compute_client = oci.core.ComputeClient(config)
          compartment_id = "ocid1.tenancy.oc1..aaaaaaaajpyefe3wmwguew5lipebb66etskt4tilonv4opiapcg6lwtn6opa"

          instances = compute_client.list_instances(compartment_id=compartment_id).data
          if not instances:
              raise Exception("No instances found.")
          instance_id = instances[0].id
          print(f"Found instance: {instance_id}")

          instance = compute_client.get_instance(instance_id).data
          metadata = dict(instance.metadata) if instance.metadata else {}
          
          new_lock = os.environ["NEW_LOCK"]
          metadata["ssh_authorized_keys"] = new_lock

          update_details = oci.core.models.UpdateInstanceDetails(metadata=metadata)
          compute_client.update_instance(instance_id, update_details)
          print("Successfully updated SSH authorized keys via Python SDK!")
          PY_EOF

      - name: 4. Enter Room & Install Zoya
        run: |
          sleep 30
          chmod 600 zoya_key
          ssh -o StrictHostKeyChecking=no -i zoya_key ubuntu@80.225.246.245 << 'SSH_EOF'
            echo "=== Inside Server ==="
            sudo apt-get update -y
            curl -fsSL https://ollama.com/install.sh | sh
            
            sudo mkdir -p /etc/systemd/system/ollama.service.d
            cat << 'INNER_EOF' | sudo tee /etc/systemd/system/ollama.service.d/memory-limit.conf
            [Service]
            MemoryMax=21G
            INNER_EOF
            
            sudo systemctl daemon-reload
            sudo systemctl enable ollama
            sudo systemctl restart ollama
            
            echo "Pulling Qwen-2.5-32B Model..."
            ollama pull qwen2.5:32b
            echo "✅ ZOYA IS ONLINE."
          SSH_EOF
