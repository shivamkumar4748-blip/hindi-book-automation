name: Phase 2 - Direct Server Entry & Install Zoya Brain (32B)

on:
  workflow_dispatch:

jobs:
  direct-install:
    runs-on: ubuntu-latest
    steps:
      - name: Connect Directly and Setup Zoya Brain
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "=== 🚀 INSIDE THE SERVER DIRECTLY ==="
            sudo apt-get update -y
            
            echo "=== Installing Ollama ==="
            curl -fsSL https://ollama.com/install.sh | sh
            
            echo "=== Setting 21GB Cgroup Hard Limit ==="
            sudo mkdir -p /etc/systemd/system/ollama.service.d
            cat << 'EOF' | sudo tee /etc/systemd/system/ollama.service.d/memory-limit.conf
            [Service]
            MemoryMax=21G
            EOF
            
            sudo systemctl daemon-reload
            sudo systemctl enable ollama
            sudo systemctl restart ollama
            
            echo "=== Pulling Qwen 2.5 32B Model ==="
            ollama pull qwen2.5:32b
            
            echo "=== 🏆 SUCCESS: ZOYA'S BRAIN IS FULLY INSTALLED! ==="
            
