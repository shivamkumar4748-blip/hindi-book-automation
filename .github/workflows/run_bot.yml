name: Shivam Hindi Book Auto-Uploader

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install internetarchive requests Pillow

      - name: Run Automation Script
        env:
          IA_ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python bot.py
          
